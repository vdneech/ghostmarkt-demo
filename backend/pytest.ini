[pytest]
pythonpath = .
env =
    DEBUG=True
    ON_WEBHOOKS=False
    BOT__TOKEN=1234567890:ABCdefGhIJKlmNoPQRsTUVwxyZ-placeholder
    BOT__WEBHOOK_SECRET_TOKEN=placeholder_webhook_secret_token
    WEBHOOK_URL=http://localhost:8000/api/webhooks/telegram

    ROBOKASSA__MERCHANT_LOGIN=GhostMarketDemo
    ROBOKASSA__PASSWORD_1=placeholder_robokassa_password_1
    ROBOKASSA__PASSWORD_2=placeholder_robokassa_password_2
    ROBOKASSA__IS_TEST=1

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
