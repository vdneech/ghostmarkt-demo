{% extends "ru_base.html" %}

{% block title %}Код подтверждения{% endblock %}

{% block content %}
<h1 style="margin: 0 0 16px 0; font-size: 18px; font-weight: 700; color: #202123; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    ПОДТВЕРЖДЕНИЕ ВХОДА
</h1>

<p style="margin: 0 0 32px 0; font-size: 14px; color: #666666; text-align: center; line-height: 1.6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    Используйте этот код для подтверждения действия:
</p>

<div style="text-align: center; margin-bottom: 32px;">
    <div style="display: inline-block; background-color: #f7f7f8; border-radius: 4px; padding: 16px 32px; font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        {{ code }}
    </div>
</div>

<p style="margin: 0; font-size: 12px; color: #999999; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    Код действителен в течение 2 минут. Если это были не вы, просто проигнорируйте это письмо.
</p>
{% endblock %}
