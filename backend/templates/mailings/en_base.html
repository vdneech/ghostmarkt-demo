<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notification{% endblock %}</title>
    <style>
        body, table, td, a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #202123;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-top: 6px solid #202123;
            border-radius: 4px;
            overflow: hidden;
        }

        .header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
            background-color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #202123;
        }

        .content {
            padding: 32px 24px;
            background-color: #ffffff;
        }

        .footer {
            padding: 24px;
            text-align: center;
            font-size: 11px;
            color: #71717a;
            background-color: #f7f7f8;
            border-top: 1px solid #e0e0e0;
        }
        
        .accent-text {
            color: #202123;
            font-weight: 700;
        }
        
        a {
            color: #202123;
            text-decoration: underline;
        }
        
        a:hover {
            color: #000000;
        }
    </style>
</head>
<body style="margin: 0; padding: 40px 0; background-color: #f7f7f8; -webkit-font-smoothing: antialiased;">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color: #f7f7f8;">
    <tr>
        <td align="center" style="padding: 20px;">
            <table class="container" width="100%" border="0" cellpadding="0" cellspacing="0"
                   style="max-width: 600px; background-color: #ffffff; border: 1px solid #e0e0e0; border-top: 6px solid #202123; border-radius: 4px;">

                <tr>
                    <td class="header" align="center" valign="middle"
                        style="padding: 24px; border-bottom: 1px solid #e0e0e0; text-align: center; background-color: #ffffff;">
                        <img src="{{ logo }}" alt="GhostMarkt Logo" width="64" height="auto" style="display: block; outline: none; border: none; text-decoration: none; margin: 0 auto;">
                    </td>
                </tr>

                <tr>
                    <td class="content" style="padding: 32px 24px; background-color: #ffffff; font-size: 14px; color: #202123; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                        {% block content %}{% endblock %}
                    </td>
                </tr>

                <tr>
                    <td class="footer" align="center"
                        style="padding: 24px; font-size: 11px; color: #71717a; background-color: #f7f7f8; border-top: 1px solid #e0e0e0; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
                        <p style="margin: 0;">© 2026 GhostMarkt. All rights reserved.</p>
                        <p style="margin: 8px 0 0 0; font-size: 10px;">This is an automated email, please do not reply to it.</p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
